[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ai"
version = "0.1.0"
description = "VSL400 Dual-Head Keypoint Selection and Isolated Sign Language Recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.23.0",
    "hf_transfer>=0.1.6",
    "pyarrow>=15.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "wandb>=0.18.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "torchmetrics>=1.0",
    "ultralytics==8.4.146",
    "opencv-python>=4.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "pyright>=1.1.350",
]
export = [
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "onnxscript>=0.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --strict-markers"
